apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubepulse-engine
  namespace: kubepulse-system
  labels:
    app.kubernetes.io/name: kubepulse
    app.kubernetes.io/component: sre-engine
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kubepulse-engine
  template:
    metadata:
      labels:
        app: kubepulse-engine
    spec:
      serviceAccountName: kubepulse-sa
      containers:
        - name: kubepulse
          image: kubepulse:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5050
              name: http
          env:
            - name: KUBEPULSE_PORT
              value: "5050"
            - name: KUBEPULSE_MODE
              value: "auto"
            - name: SLO_AVAILABILITY_TARGET
              value: "99.9"
            - name: SLO_LATENCY_P99_TARGET_MS
              value: "250.0"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
